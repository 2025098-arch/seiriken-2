<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間別 整理券システム</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .slot-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .box { background: white; border: 1px solid #ddd; padding: 15px; width: 300px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .time { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .status { font-size: 14px; color: #555; margin-bottom: 15px; }
        .number { font-size: 32px; font-weight: bold; color: #007bff; margin: 10px 0; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; margin: 3px; border: none; border-radius: 5px; background: #007bff; color: white; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .admin-btn { background: #28a745; }
        .reset-btn { background: #dc3545; display: block; margin: 30px auto; padding: 10px 20px; }
        #message { font-size: 18px; font-weight: bold; color: #d9534f; margin-top: 20px; min-height: 25px; }
    </style>
</head>
<body>
    <h2>時間別 整理券システム</h2>
    <div id="message"></div>

    <div class="slot-container" id="slots">
        <!-- 枠がここに動的に生成されます -->
    </div>

    <button class="reset-btn" onclick="resetAll()">全データをリセット (管理者用)</button>

    <script>
        async function fetchStatus() {
            const res = await fetch('/api/slots');
            const slots = await res.json();
            const container = document.getElementById('slots');
            container.innerHTML = '';

            slots.forEach(slot => {
                const isFull = slot.issued >= slot.maxTickets;

                const box = document.createElement('div');
                box.className = 'box';
                box.innerHTML = `
                    <div class="time">${slot.time}</div>
                    <div class="status">発券数: ${slot.issued} / ${slot.maxTickets} (上限)</div>
                    <div>現在のお呼び出し</div>
                    <div class="number">${slot.called} 番</div>
                    <hr>
                    <button onclick="issueTicket('${slot.time}')" ${isFull ? 'disabled' : ''}>
                        ${isFull ? '満員' : '発券する'}
                    </button>
                    <br><br>
                    <div style="background: #e9ecef; padding: 10px; border-radius: 5px;">
                        <span style="font-size: 12px;">管理者用</span><br>
                        <button class="admin-btn" onclick="callNext('${slot.time}')">次を呼ぶ</button>
                    </div>
                `;
                container.appendChild(box);
            });
        }

        async function issueTicket(time) {
            const res = await fetch('/api/issue', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ time })
            });
            const data = await res.json();

            if (data.error) {
                showMessage(data.error);
            } else {
                showMessage(`${data.time}の整理券を発行しました。あなたの番号: ${data.ticketNumber}番`);
            }
            fetchStatus();
        }

        async function callNext(time) {
            await fetch('/api/call', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ time })
            });
            fetchStatus();
        }

        async function resetAll() {
            if(confirm('すべての時間帯の整理券をリセットしますか？')) {
                await fetch('/api/reset', { method: 'POST' });
                showMessage('リセット完了しました');
                fetchStatus();
            }
        }

        function showMessage(msg) {
            const msgEl = document.getElementById('message');
            msgEl.innerText = msg;
            setTimeout(() => msgEl.innerText = '', 5000);
        }

        fetchStatus();
        setInterval(fetchStatus, 3000); // 3秒自動更新
    </script>
</body>
</html>
