<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB DASHBOARD</title>
    <style>
        /* ラボ・サイバー風デザイン */
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #0b0f19; /* 暗い背景 */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px; /* グリッド線 */
            margin: 0; padding: 20px; color: #00ffcc; 
        }
        h1 { text-align: center; color: #00ffcc; font-size: 24px; margin-bottom: 5px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .header-info { text-align: center; color: #6b8299; font-size: 12px; margin-bottom: 25px; }

        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .tab-btn { 
            padding: 10px 30px; font-size: 16px; font-weight: bold; font-family: inherit;
            border: 1px solid #00ffcc; background: transparent; color: #00ffcc; 
            cursor: pointer; transition: 0.2s; box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.1);
        }
        .tab-btn.active { background: rgba(0, 255, 204, 0.2); box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); }

        .dashboard { display: grid; gap: 15px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); max-width: 1200px; margin: 0 auto; }

        .card { 
            background: rgba(11, 15, 25, 0.8); border: 1px solid #1f3a52; padding: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 4px solid #00ffcc; 
            backdrop-filter: blur(4px);
        }
        .time-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #fff; border-bottom: 1px dashed #1f3a52; padding-bottom: 5px; }

        .counter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 8px 0; }
        .counter-label { font-size: 14px; font-weight: bold; color: #8fa6bd; letter-spacing: 1px; width: 65px; }
        .counter-controls { display: flex; align-items: center; gap: 12px; }

        .btn-calc { 
            width: 40px; height: 40px; font-size: 20px; font-weight: bold; font-family: inherit;
            border: 1px solid #1f3a52; background: #131d2b; color: #fff; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.1s;
        }
        .btn-calc:active { background: #00ffcc; color: #000; }
        .btn-calc:disabled { opacity: 0.3; cursor: not-allowed; border-color: #333; color: #666; background: #000; }

        /* 数値の表示部分 */
        .count-display { font-size: 26px; font-weight: bold; width: 80px; text-align: center; color: #fff; }
        .count-display span { font-size: 12px; color: #6b8299; margin-left: 2px; }
        .max-alert { color: #ff3366 !important; text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }

        /* 呼出用カラー（オレンジ系） */
        .called-label { color: #ffaa00; }
        .called-text { color: #ffaa00; }

        .reset-btn { 
            background: #ff3366; display: block; margin: 50px auto; padding: 10px 20px; 
            font-size: 12px; font-family: inherit; color: white; border: none; cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3); opacity: 0.7;
        }
        .reset-btn:hover { opacity: 1; }
    </style>
</head>
<body>
    <h1>[ SYSTEM ] TICKET DASHBOARD</h1>
    <div class="header-info">> SYNC: ONLINE (3000ms interval)</div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-Day 1" onclick="switchDay('Day 1')">DAY_01</button>
        <button class="tab-btn" id="tab-Day 2" onclick="switchDay('Day 2')">DAY_02</button>
    </div>

    <div class="dashboard" id="slots"></div>

    <button class="reset-btn" onclick="hardReset()">[!] SYSTEM FORMAT (ALL DATA DELETE)</button>

    <script>
        let currentDay = 'Day 1';
        let localData = []; // 画面をサクサク動かすための手元データ

        function switchDay(day) {
            currentDay = day;
            document.getElementById('tab-Day 1').classList.toggle('active', day === 'Day 1');
            document.getElementById('tab-Day 2').classList.toggle('active', day === 'Day 2');
            renderUI();
        }

        // サーバーからデータを取得
        async function fetchStatus() {
            try {
                const res = await fetch('/api/slots');
                localData = await res.json();
                renderUI();
            } catch (err) {
                console.error('Data Sync Error:', err);
            }
        }

        // 画面を描画する関数
        function renderUI() {
            const slots = localData.filter(s => s.day === currentDay);
            const container = document.getElementById('slots');
            container.innerHTML = '';

            slots.forEach(slot => {
                const issued = slot.issued || 0;
                const called = slot.called || 0;
                const max = slot.maxTickets || 20;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="time-title">> TIME_SLOT [ ${slot.time} ]</div>

                    <div class="counter-row">
                        <div class="counter-label">ISSUED<br>(発券)</div>
                        <div class="counter-controls">
                            <button class="btn-calc" onclick="updateCount('${slot.day}', '${slot.time}', 'issued', -1)" ${issued <= 0 ? 'disabled' : ''}>-</button>
                            <div class="count-display ${issued >= max ? 'max-alert' : ''}">${issued}<span>/${max}</span></div>
                            <button class="btn-calc" onclick="updateCount('${slot.day}', '${slot.time}', 'issued', 1)" ${issued >= max ? 'disabled' : ''}>+</button>
                        </div>
                    </div>

                    <div class="counter-row">
                        <div class="counter-label called-label">CALLED<br>(呼出)</div>
                        <div class="counter-controls">
                            <button class="btn-calc" onclick="updateCount('${slot.day}', '${slot.time}', 'called', -1)" ${called <= 0 ? 'disabled' : ''}>-</button>
                            <div class="count-display called-text">${called}</div>
                            <button class="btn-calc" onclick="updateCount('${slot.day}', '${slot.time}', 'called', 1)" ${called >= issued ? 'disabled' : ''}>+</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ボタンを押した時の処理
        function updateCount(day, time, type, change) {
            // 1. まず画面(手元)のデータだけを一瞬で書き換える（サクサク動かすため）
            const slot = localData.find(s => s.day === day && s.time === time);
            if (slot) {
                if (type === 'issued') {
                    slot.issued = Math.max(0, Math.min(slot.maxTickets, slot.issued + change));
                    if (slot.called > slot.issued) slot.called = slot.issued; // 発券数より呼出数が多くならないように調整
                } else if (type === 'called') {
                    slot.called = Math.max(0, Math.min(slot.issued, slot.called + change)); // 発券数を超えられない
                }
                renderUI(); // 画面を即座に更新
            }

            // 2. 裏側でひっそりサーバーに送信する（待たせない）
            fetch('/api/update-count', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ day, time, type, change })
            }).catch(err => console.error("Sync error", err));
        }

        async function hardReset() {
            if(confirm('WARNING: すべてのデータを消去し、初期化しますか？')) {
                await fetch('/api/hard-reset', { method: 'POST' });
                alert('SYSTEM: FORMAT COMPLETED.');
                fetchStatus();
            }
        }

        // 最初の一回読み込み ＋ 3秒ごとのバックグラウンド同期
        fetchStatus();
        setInterval(fetchStatus, 3000);
    </script>
</body>
</html>
